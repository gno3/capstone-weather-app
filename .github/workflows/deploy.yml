name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    env:
      APP: ${{ vars.APP }}
      RG: ${{ vars.RG }}
    steps:
      - name: Only main can be deployed
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Only main can be deployed (this run is on $GITHUB_REF)."
          exit 1

      - name: Check configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=()
          [[ -n "$APP" ]] || missing+=("variable APP")
          [[ -n "$RG" ]] || missing+=("variable RG")
          [[ -n "$AZURE_CLIENT_ID" ]] || missing+=("secret AZURE_CLIENT_ID")
          [[ -n "$AZURE_TENANT_ID" ]] || missing+=("secret AZURE_TENANT_ID")
          [[ -n "$AZURE_SUBSCRIPTION_ID" ]] || missing+=("secret AZURE_SUBSCRIPTION_ID")
          if ((${#missing[@]})); then
            for item in "${missing[@]}"; do
              echo "::error::Missing repository $item (see README, CI/CD)."
            done
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # package.sh runs npm run build, which is the build check
      - run: ./scripts/package.sh

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Read-only lookup; fails if the web app has not been provisioned by deploy.sh.
      - name: Find web app
        id: app
        run: |
          host=$(az webapp show -g "$RG" -n "$APP" --query defaultHostName -o tsv)
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Upload package
        run: az webapp deploy -g "$RG" -n "$APP" --src-path app.zip --type zip

      - name: Wait for /api/health
        env:
          HOST: ${{ steps.app.outputs.host }}
        run: |
          source scripts/deploy.sh
          wait_healthy "https://$HOST"
          echo "Deployed https://$HOST"
          echo "Deployed to https://$HOST" >> "$GITHUB_STEP_SUMMARY"
