schema: spec-driven
githubCopilot:
  cloudAgent: false

context: |
  Purpose: prototype weather dashboard for an AI-enabled engineering capstone.
  Stack: Next.js App Router, TypeScript (strict), Tailwind CSS, Recharts, Vitest.
  Hosting: Azure App Service (Linux, Node 22 LTS), Next.js standalone output.
  Constraints:
  - Data only from Open-Meteo (forecast + geocoding). No API keys.
  - The browser never calls Open-Meteo. Server components and /api route handlers do,
    through lib/openmeteo.ts only.
  - lib/openmeteo.ts maps raw JSON to types in lib/types.ts; components never see raw API shapes.
  - Server fetches use next: { revalidate: 600 } (geocoding: 86400).
  - Location and units live in the URL (?lat=&lon=&name=&units=) so views are shareable.
  - Show "Weather data by Open-Meteo.com" with a link on every page (CC BY 4.0).
  - Units default to imperial (°F, mph); metric (°C, km/h) via toggle.
  - Errors show a friendly message, never a stack trace.
  - Mobile-first; must work at 375px wide.


# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
